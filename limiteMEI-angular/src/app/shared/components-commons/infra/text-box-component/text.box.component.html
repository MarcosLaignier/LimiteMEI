<div [ngClass]="colClass" [style.width]="width || '435px'" [style.max-width]="'100%'">
  <label class="form-label">{{ label + ':'}}</label>
  <input type="text" class="form-control" [ngModel]="displayValue"
         (ngModelChange)="onValueChange($event)" [placeholder]="placeholder"
         [disabled]="disabled" [attr.maxlength]="inputMaxLength">
</div>
