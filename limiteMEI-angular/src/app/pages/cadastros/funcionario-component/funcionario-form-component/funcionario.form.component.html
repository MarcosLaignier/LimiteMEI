<toolbar-filter tituloPagina="Funcionário" [listMode]="false" [loading]="loading" (salvar)="save()" (limpar)="clear()"></toolbar-filter><section class="employee-form"><div class="card"><div class="card-body p-4"><header><i class="bi bi-person-badge"></i><div><h2>Dados do funcionário</h2><p>Selecione uma pessoa existente e informe os dados do vínculo.</p></div></header><div class="fields"><pessoa-selector-component [(pessoa)]="pessoa" [disabled]="loading" (pessoaChange)="selecionar($event)" (novaPessoa)="novaPessoa()"></pessoa-selector-component><text-box-component label="Cargo" colClass="" [(dataField)]="model.cargo"></text-box-component><date-box-component label="Data de Admissão" colClass="" [(dataField)]="model.dataAdmissao"></date-box-component><date-box-component label="Data de Demissão" colClass="" [clearButton]="true" [dataField]="model.dataDemissao??''" (dataFieldChange)="model.dataDemissao=$event||undefined"></date-box-component><number-box-component label="Salário" colClass="" width="220px" [dataField]="model.salario??0" (dataFieldChange)="model.salario=$event"></number-box-component><div class="status"><span>Situação</span><switch-component label="Funcionário ativo" [(dataField)]="model.ativo"></switch-component></div></div></div></div></section>
