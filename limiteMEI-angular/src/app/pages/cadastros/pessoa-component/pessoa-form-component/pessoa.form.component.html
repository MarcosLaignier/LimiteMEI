<toolbar-filter tituloPagina="Pessoa" [listMode]="false" [loading]="loading" (salvar)="save()" (limpar)="clear()"></toolbar-filter><section class="person-form"><div class="card"><div class="card-body p-4"><header><i class="bi bi-person-vcard"></i><div><h2>Dados da pessoa</h2><p>Este cadastro poderá ser reutilizado como cliente, fornecedor ou funcionário.</p></div></header><div class="fields"><select-enum label="Tipo de pessoa" colClass="" width="240px" [enumObject]="tipoPessoaEnum" [optionLabels]="tipoPessoaLabels" [(dataField)]="model.tipoPessoa"></select-enum><text-box-component label="Nome / Razão social" colClass="" [(dataField)]="model.nomeRazaoSocial"></text-box-component><text-box-component label="Nome fantasia" colClass="" [(dataField)]="model.nomeFantasia"></text-box-component><text-box-component label="CPF / CNPJ" colClass="" width="245px" [mask]="model.tipoPessoa===tipoPessoaEnum.FISICA?'cpf':'cnpj'" [(dataField)]="model.cpfCnpj"></text-box-component><text-box-component label="E-mail" colClass="" [(dataField)]="model.email"></text-box-component><text-box-component label="Telefone" colClass="" width="220px" mask="telefone" [(dataField)]="model.telefone"></text-box-component><div class="status"><span>Situação</span><switch-component label="Pessoa ativa" [(dataField)]="model.ativo"></switch-component></div></div></div></div></section>
