<toolbar-filter tituloPagina="Conta financeira" [listMode]="false" [loading]="loading" (salvar)="save()" (limpar)="clear()" />
<section class="account-card"><div class="heading"><i class="bi bi-bank"></i><div><h2>Dados da conta</h2><p>Informe o caixa, banco ou carteira utilizada pela empresa.</p></div></div><div class="fields"><text-box-component label="Nome da conta" width="435px" [(dataField)]="model.nome" [disabled]="loading" /><select-enum label="Tipo" width="240px" [enumObject]="tipos" [optionLabels]="tipoLabels" [(dataField)]="model.tipo" [disabled]="loading" /><select-enum label="Banco" width="300px" [enumObject]="bancos" [optionLabels]="bancoLabels" [(dataField)]="model.instituicao" [disabled]="loading" /><text-box-component label="Agência" width="150px" [(dataField)]="model.agencia" [disabled]="loading" /><text-box-component label="Número da conta" width="220px" [(dataField)]="model.numeroConta" [disabled]="loading" /><number-box-component label="Saldo inicial" width="180px" [(dataField)]="model.saldoInicial" [disabled]="loading" /><div class="status"><span>Situação</span><switch-component label="Conta ativa" [(dataField)]="model.ativo" [disabled]="loading" /><small>Contas inativas não poderão receber novas movimentações.</small></div></div></section>
